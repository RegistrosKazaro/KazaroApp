<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: que la página llegue a los bordes de la pantalla
         en los iPhone con muesca. Lo de arriba lo resuelve theme-color. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/Kazaro.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Sin apple-mobile-web-app-capable: esa meta abre en pantalla completa
         por su cuenta, aunque el manifiesto diga display: browser. En pantalla
         completa iOS dibuja él la franja del reloj con un degradado que no se
         puede controlar desde la página. Va junto con el manifiesto: si algún
         día se vuelve a pantalla completa, hay que tocar los dos. -->
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-title" content="Insumos" />
    <title>Insumos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script> 
  </body>
</html>
