<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: que la página llegue a los bordes de la pantalla
         en los iPhone con muesca. Lo de arriba lo resuelve theme-color. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/Kazaro.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- El color de la franja del reloj en la app instalada. Sin declararlo,
         iOS se inventa un degradado difuminado ahí (reportado 22/10/2026).
         Es el mismo color que .appbar, así que se lee como una sola barra.
         `black` en vez de `black-translucent`: con translucent la página se
         dibuja DEBAJO del reloj, y iOS lo ignora cuando hay manifiesto. -->
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Insumos" />
    <title>Insumos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script> 
  </body>
</html>
